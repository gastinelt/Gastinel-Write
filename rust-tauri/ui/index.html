<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Gastinel Write</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="toolbar" role="toolbar" aria-label="Fichier">
    <span class="product-name">Gastinel Write</span>
    <nav class="actions">
      <button type="button" data-action="new" title="Nouveau (Ctrl+N)">Nouveau</button>
      <button type="button" data-action="open" title="Ouvrir (Ctrl+O)">Ouvrir</button>
      <button type="button" data-action="save" title="Enregistrer (Ctrl+S)">Enregistrer</button>
    </nav>
  </header>

  <main>
    <textarea id="editor" spellcheck="false" autofocus aria-label="Document"
              placeholder="L'écriture, sans fard."></textarea>
  </main>

  <footer>
    <span id="status" aria-live="polite">0 mot</span>
    <span class="legal">Gastinel. Logiciel libre de droit.</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
